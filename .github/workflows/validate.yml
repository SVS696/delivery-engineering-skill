name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate package and profiles
        run: python3 scripts/delivery_pipeline.py validate
      - name: Validate literature routes
        run: python3 scripts/delivery_context.py validate
      - name: Audit role prompts
        run: python3 scripts/prompt_audit.py validate --skill-root .
      - name: Run regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'

